<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homepage</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

</head>
<body>
    <!-- Thanh điều hướng (Navigation) -->
    <nav class="navbar">
      <div class="nav-left">
        <a href="index.html" class="brand">
          <img src="images/logo8.jfif" alt="Zhome logo" class="logo">
          <strong>Zhome</strong>
        </a>
      </div>
      <div class="nav-middle">
        <ul>
          <li><a href="#">Sản phẩm</a></li>
          <li><a href="#">Khuyến mãi</a></li>
          <li><a href="#">Tin tức</a></li>
          <li><a href="#">Về Zhome</a></li>
        </ul>
      </div>
      <div class="nav-right">
        <div class="search-bar">
          <input type="text" placeholder="Tìm kiếm sản phẩm . . .">
            <button><i class="fa fa-search"></i></button>
        </div>
        <div class="cart">
          <i class="fa fa-shopping-cart"></i>
          <a href="#"> Giỏ hàng</a>
        </div>
        <div class="login">
          <i class="fa fa-user"></i>
          <a href="#"> Đăng nhập / </a> <a href="#"> Đăng ký</a>
        </div>
      </div>
    </nav>

<header>
    <div class="banner">
      <div class="slides">
        <img src="images/banner0.jpg" class="active" alt="Banner 1">
        <img src="images/banner1.jpg" alt="Banner 2">
        <img src="images/banner2.jpg" alt="Banner 3">
        <img src="images/banner3.jpg" alt="Banner 4">
      </div>
      <button class="prev">&#10094;</button>
      <button class="next">&#10095;</button>
    </div>
    
</header>

    
<!-- Nội dung chính -->
<main>
<!-- Khung sản phẩm -->
  <section class="promotion-products">
    <h2>Các sản phẩm khuyến mãi</h2>
    <div class="product-list">
      <div class="product-item">
        <img src="images/furniture0.jpg" alt="Sản phẩm 1">
        <h3>Sản phẩm 1</h3>
        <p class="price">₫199,000</p>
      </div>
      <div class="product-item">
        <img src="images/furniture0.jpg" alt="Sản phẩm 2">
        <h3>Sản phẩm 2</h3>
        <p class="price">₫299,000</p>
      </div>
      <div class="product-item">
        <img src="images/furniture0.jpg" alt="Sản phẩm 3">
        <h3>Sản phẩm 3</h3>
        <p class="price">₫399,000</p>
      </div>
      <div class="product-item">
        <img src="images/furniture0.jpg" alt="Sản phẩm 4">
        <h3>Sản phẩm 4</h3>
        <p class="price">₫499,000</p>
      </div>
    </div>
  </section>
</main>

<!-- Footer: Thông tin liên hệ --> 
<footer> 
  <div>
    <p>Nội thất Zhome</p>
  </div> 
  <div>
    <p>Thông tin chính sách</p>
  </div>
  <div>
    <p>Thông tin liên hệ</p>
  </div>
  <div>
    <p>Fanpage</p>
  </div>
</footer> 

<script src="js/script.js"></script>

</body>
</html>
