<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homepage</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; } 
        body { font-family: Arial, sans-serif; }

        header { 
            background: #ddd; 
            padding: 20px; 
            text-align: center; 
            position: relative;
            top: 40px;
            margin-bottom: 40px;
            border: 2px solid #333;
        }
        nav { 
            background: #d1da6d; 
            padding: 10px; 
            text-align: center; 
            position: fixed;
            top: 0;
            width: 100%;
        }
        nav a { 
            margin: 0 15px; 
            text-decoration: none; 
            color: #000; 
        }
        main { 
            display: flex; 
            padding: 20px; 
            
        }
        .sidebar { 
            width: 25%; 
            background: #a94646; 
            padding: 20px; 
        } 
        .content { 
            width: 75%; 
            padding: 15px; 
        }
        .product { 
            border: 1px solid #aaa; 
            margin: 10px; padding: 20px; 
            text-align: center; 
            background: #f9f9f9; 
        }
        img {
            width: 300px;
            display: flex;
            margin: 0 auto;
        }
        footer { 
            margin-top: 20px; 
        } 
    </style>
</head>
<body>
    
    
    <!-- Thanh điều hướng (Navigation) -->
    <nav> 
        <a href="#">Trang chủ</a> 
        <a href="#">Sản phẩm</a> 
        <a href="#">Giới thiệu</a> 
        <a href="#">Liên hệ</a> 
    </nav>
    <!-- Header: Logo + tiêu đề -->
    <header> 
        <h1>Đồ Nội Thất Trong Nhà</h1> 
    </header>
    <!-- Nội dung chính -->
    <main> 
        <!-- Sidebar: Bộ lọc sản phẩm  --> 
         <img src="images/banner-p.jpg" alt="Banner cho trang web">
        <aside class="sidebar"> 
            <h2>Sản phẩm</h2> 
            <ul> <li>Bàn ghế</li> 
                <li>Tủ</li> 
                <li>Giường</li> 
                <li>Đèn</li> 
            </ul> 
        </aside>
        <!-- Khu vực hiển thị sản phẩm --> 
        <section class="content"> 
            <h2>Sản phẩm nổi bật</h2> 
            <!-- Mỗi khối product đại diện cho 1 sản phẩm --> 
                <div class="product">Ảnh SP + Tên SP + Giá</div> 
                <div class="product">Ảnh SP + Tên SP + Giá</div> 
                <div class="product">Ảnh SP + Tên SP + Giá</div> 
        </section> 
    </main>
    <!-- Footer: Thông tin liên hệ --> 
    <footer> 
        <p>© Nội Thất Gia Bảo - Địa chỉ, Số điện thoại, Email</p> 
    </footer>     
</body>
</html>
